schema_version: 1

context:
  name: tsgettoolbox_wdfn
  version: "27.1.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 6f6a429dda4c308915ad0dfca94ff7354369d3467a6f7581c4ad3268ef161ccc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=80
    - pip
  run:
    - python >=${{ python_min }}
    - aiodns >3.6.0
    - async_retriever
    - pandas
    - tsgettoolbox >=27.0.0

tests:
  - python:
      imports:
        - tsgettoolbox_wdfn
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Plugin for tsgettoolbox to retrieve data from the USGS Water Data for the Nation (WDFN) web service.
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/tsgettoolbox-wdfn/

extra:
  recipe-maintainers:
    - timcera
